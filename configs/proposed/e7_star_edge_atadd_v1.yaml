experiment: E7-star-edge-v1
input_preprocessing_version: v4.0_24khz_repeat_pad

baseline_metrics_path: experiments/baselines/E1_v4/E1_ATADD_eval_metrics_v4.json
logmel_stats_path: experiments/baselines/E1_v4/E1_ATADD_logmel_stats_v4.json

dataset:
  audio_root: AT_ADD_BTP
  train_manifest: data/manifests/train_manifest.csv
  dev_manifest: data/manifests/dev_manifest.csv
  eval_manifest: data/manifests/eval_manifest.csv

audio:
  sample_rate: 24000
  segment_seconds: 4

spectrogram:
  n_fft: 1024
  win_length: 600
  hop_length: 240
  n_mels: 80
  log_epsilon: 1.0e-10

training:
  seed: 42
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 5
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true

selection:
  use_j_score: true
  lambda_delta: 0.5
  delta_num_samples: 384

ft_rcl:
  beta: 0.5
  gamma_pc: 1.0
  gamma_ftsc: 0.5
  type_alpha:
    speech: 1.0
    singing: 1.0
    music: 0.3
    sound: 0.5
  curriculum:
    epoch_milestones: [1, 6, 13]
    severity_milestones: [1, 3, 4]

star_edge:
  enabled: true
  use_stc: true
  use_cad: true
  use_abr: true
  delta: 0.3
  rho: 0.2
